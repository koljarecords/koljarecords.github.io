<style>
:root{color-scheme:light;--bg:oklch(.88 .075 202);--ink:oklch(.23 .035 207);--muted:oklch(.36 .04 207);--white:oklch(1 0 0)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px 20px}
main{width:min(100%,460px);text-align:center}
.tag{display:inline-block;margin:0 0 12px;padding:7px 14px;border:1px solid currentColor;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.02em}
h1{font-size:clamp(2rem,7.5vw,2.7rem);line-height:1.06;letter-spacing:-.035em;margin:0 auto 20px;text-wrap:balance;font-weight:850}
h1 span{white-space:nowrap}
figure{margin:0 auto;width:min(100%,370px);padding:9px 9px 0;background:var(--white);border-radius:10px;overflow:hidden;transform:rotate(-1deg)}
img{display:block;width:100%;height:auto;border-radius:4px}
figcaption{font-size:14px;font-weight:750;padding:12px 5px 14px;line-height:1.3}
.joke{margin:22px 0 0;font-size:17px;line-height:1.45;font-weight:650}
.foot{margin:7px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
@media(min-width:900px){main{width:min(100%,950px);display:grid;grid-template-columns:1fr 390px;column-gap:64px;text-align:left;align-items:center}.copy{grid-column:1;grid-row:1}h1{font-size:3.8rem;line-height:1.03;margin-bottom:0}.tag{margin-bottom:24px}figure{grid-column:2;grid-row:1/3;width:100%;margin:0}.ending{grid-column:1;grid-row:2;align-self:start}.joke{font-size:21px;margin-top:24px}.foot{font-size:14px}}
@media(max-width:360px){body{padding:20px 16px}h1{font-size:1.9rem}figure{width:92%}.joke{font-size:15px}}
</style>
</head>
<body>
<main>
<div class="copy"><p class="tag">Entrega especial</p><h1>Seu prêmio <span>chegou 🏆</span></h1></div>
<figure><img src="photo.jpg" width="550" height="712" alt="Gorila olhando para a câmera e mostrando o dedo do meio, como parte de uma pegadinha." fetchpriority="high"><figcaption>Escolhido a dedo. 🤌</figcaption></figure>
<div class="ending"><p class="joke">É pegadinha. Mas o carinho é real. 😂</p><p class="foot">Pode rir. Esse prêmio é só uma brincadeira.</p></div>
</main>
</body>
